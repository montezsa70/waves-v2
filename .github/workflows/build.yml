name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Unzip the project if it is a zip
        run: |
          Z=$(find . -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$Z" ]; then
            echo "Unzipping $Z"
            mkdir -p /tmp/src
            unzip -q "$Z" -d /tmp/src
          fi

      - name: Find the project folder
        id: find
        run: |
          S=$(find . /tmp/src -name settings.gradle.kts -not -path './.git/*' 2>/dev/null | head -n 1)
          if [ -z "$S" ]; then
            echo "settings.gradle.kts not found. Files in the repo:"
            find . -not -path './.git/*' | head -n 60
            exit 1
          fi
          echo "dir=$(realpath "$(dirname "$S")")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" > /dev/null

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-linux-android --target armv7-linux-androideabi
          rustup default stable

      - name: cargo-ndk
        run: command -v cargo-ndk > /dev/null || cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.0

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle :app:assembleDev --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: waves-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/dev/app-universal-dev.apk
          if-no-files-found: error
