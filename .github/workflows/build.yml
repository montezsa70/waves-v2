name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        shell: bash
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" > /dev/null

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-linux-android --target armv7-linux-androideabi
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'native/vendor/**', 'native/src/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: native-dsp/bungee
          key: bungee-${{ hashFiles('app/build.gradle.kts') }}

      - name: cargo-ndk
        shell: bash
        run: command -v cargo-ndk > /dev/null || cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew :app:assembleDev --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: waves-dev-${{ github.sha }}
          path: app/build/outputs/apk/dev/app-universal-dev.apk
          retention-days: 14
          if-no-files-found: error
